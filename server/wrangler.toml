name = "threewood-rooms"
main = "room.js"
compatibility_date = "2026-01-01"
workers_dev = true

# rooms.threewood.app: Cloudflare makes the DNS record and certificate itself
routes = [
  { pattern = "rooms.threewood.app", custom_domain = true }
]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

# Incident containment: fail closed in code even if this variable is absent.
[vars]
ROOMS_ENABLED = "false"

[limits]
cpu_ms = 50
