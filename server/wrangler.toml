name = "threewood-rooms"
main = "room.js"
compatibility_date = "2026-01-01"
workers_dev = false
preview_urls = false

# Parked: no public ingress while the game is inactive.
# Restore rooms.threewood.app explicitly when multiplayer is ready.
routes = []

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

# Incident containment: fail closed in code even if this variable is absent.
[vars]
ROOMS_ENABLED = "false"

[limits]
cpu_ms = 50
